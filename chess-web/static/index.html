<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Chess vs Bot</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Chess vs Bot</h1>

  <div class="controls">
    <label for="elo">Elo bot: <span id="eloValue">1200</span></label>
    <input type="range" id="elo" min="400" max="3000" step="50" value="1200" />
    <button id="resetBtn">Ván mới</button>
  </div>

  <div id="board" style="width: 400px"></div>
  <p id="status"></p>
  <p><a href="history.html">Lịch sử ván đấu &rarr;</a></p>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
